name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::private_intra_doc_links
        run: cargo doc --all-features --locked --no-deps --document-private-items

      - name: Run tests (default features)
        run: cargo test --locked

      - name: Run tests (all features)
        run: cargo test --all-features --locked

      - name: Verify crate package
        run: cargo package --locked

      - name: Check commit messages
        uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          commits: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || github.event_name == 'push'
              && format('{0}..{1}', github.event.before, github.sha)
              || github.sha }}

  release_please:
    name: Release Please
    needs: build_and_test
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to crates.io
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: crates.io
      url: https://crates.io/crates/m68k

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0

      - name: Verify release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "m68k") | .version')"
          expected_tag="m68k-v${RELEASE_VERSION}"

          if [[ "${manifest_version}" != "${RELEASE_VERSION}" ]]; then
            echo "Cargo.toml version ${manifest_version} does not match release ${RELEASE_VERSION}" >&2
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match expected tag ${expected_tag}" >&2
            exit 1
          fi

      - name: Verify crate package
        run: cargo package --locked

      - name: Publish crate
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
