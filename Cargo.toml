[package]
name = "m68k"
version = "0.2.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A safe Rust M68000 family CPU emulator"
repository = "https://github.com/benletchford/m68k-rs"
readme = "README.md"
keywords = ["68000", "emulation", "m68k", "motorola"]
categories = ["emulators"]
publish = ["crates-io"]
exclude = [
    "/.github/**",
    "/.gitignore",
    "/.gitmodules",
    "/.release-please-manifest.json",
    "/CONTRIBUTING.md",
    "/release-please-config.json",
    "/rust-toolchain.toml",
    "/scripts/**",
    "/tests/**",
]

[dependencies]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-codegen = "0.132.0"
cranelift-frontend = "0.132.0"
cranelift-jit = "0.132.0"
cranelift-module = "0.132.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "microbench"
harness = false
